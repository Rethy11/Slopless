<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Slopless</title>

<!-- Icons and Open Graph Image -->
<link rel="icon" type="image/svg+xml" href="https://rethy11.github.io/Slopless/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="https://rethy11.github.io/Slopless/apple-touch-icon.PNG">
<meta property="og:url" content="https://rethy11.github.io/Slopless/">
<meta property="og:image" content="https://rethy11.github.io/Slopless/og-image.PNG">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:title" content="Slopless">
<meta property="og:description" content="Web results, no AI overview.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFBF8;
    --ink: #1B1F23;
    --muted: #8A8F98;
    --accent: #1F7A64;
    --accent-soft: #E4F1EC;
    --line: #E3E3DE;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    overflow: hidden;
    position: fixed;
    inset: 0;
    overscroll-behavior: none;
    background: var(--bg);
  }
  body {
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  #wave-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }
  .page {
    position: relative;
    z-index: 1;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wordmark {
    font-family: 'Sora', sans-serif;
    font-size: clamp(2.25rem, 9vw, 3.75rem);
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    display: flex;
    line-height: 1;
  }
  .wordmark .slop {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--muted);
    font-weight: 400;
  }
  .wordmark .less {
    color: var(--ink);
    font-weight: 700;
  }
  .tagline {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 40px;
    letter-spacing: 0.01em;
    text-align: center;
  }
  form {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .search-container {
    width: 100%;
    position: relative;
  }
  .search-row {
    width: 100%;
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 4px 4px 22px;
    background: #fff;
    transition: box-shadow 0.15s ease, border-color 0.15s ease, border-radius 0.1s ease;
    position: relative;
    z-index: 2;
  }
  .search-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    padding: 13px 8px;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  button {
    flex-shrink: 0;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #175F4E; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Predictive Search Suggestions Dropdown Styling */
  .suggestions-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--accent);
    border-top: none;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 4px 12px var(--accent-soft);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1;
    margin-top: -1px; /* Overlap border */
    padding-bottom: 8px;
  }
  .suggestions-dropdown.active {
    display: flex;
  }
  .suggestion-item {
    padding: 10px 22px;
    cursor: pointer;
    color: var(--ink);
    font-size: 1rem;
    text-align: left;
    transition: background 0.15s ease;
  }
  .suggestion-item:hover {
    background: var(--bg);
  }
</style>
</head>
<body>
  <canvas id="wave-canvas"></canvas>

  <div class="page">
    <div class="wordmark"><span class="slop">slop</span><span class="less">less</span></div>
    <p class="tagline" id="tagline-text">web results, no AI overview</p>

    <form id="search-form">
      <div class="search-container">
        <div class="search-row" id="search-row">
          <label for="q" class="visually-hidden">Search query</label>
          <input type="text" id="q" name="q" placeholder="Search the web" autocomplete="off" autofocus>
          <button type="submit">Search</button>
        </div>
        <div class="suggestions-dropdown" id="suggestions-dropdown"></div>
      </div>
    </form>
  </div>

<script>
  // Random Taglines
  const taglines = [
    "Web results, no AI overview.",
    "Learn more, Slopless.",
    "Because AI hallucinations are exhausting.",
    "Just the links, please.",
    "100% artisanal, hand-crafted blue links.",
    "Like it's 2010 all over again.",
    "How many r's in strawberry?",
    "Have you tried adding glue to pizza?",
    "AI will probably most likely lead to the end of the world, but in the meantime, there'll be great companies.",
    "Raindrop, Sloptop."
  ];
  
  document.getElementById('tagline-text').innerText = taglines[Math.floor(Math.random() * taglines.length)];

  const form = document.getElementById('search-form');
  const input = document.getElementById('q');
  const searchRow = document.getElementById('search-row');
  const dropdown = document.getElementById('suggestions-dropdown');

  // Advanced predictive suggestions using JSONP
  let debounceTimer;

  input.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    const query = e.target.value.trim();
    if (!query) {
      closeDropdown();
      return;
    }
    
    // Debounce the API call
    debounceTimer = setTimeout(() => {
      const script = document.createElement('script');
      // Fetching live autocomplete suggestions
      script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleSuggestions`;
      document.body.appendChild(script);
      script.onload = () => script.remove();
    }, 150);
  });

  // Global callback for JSONP suggestion results
  window.handleSuggestions = function(data) {
    const suggestions = data[1].slice(0, 5); // Limit to top 5 results
    if (suggestions.length === 0) {
      closeDropdown();
      return;
    }
    
    dropdown.innerHTML = '';
    suggestions.forEach(suggestion => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';
      div.innerText = suggestion;
      
      div.addEventListener('click', () => {
        input.value = suggestion;
        closeDropdown();
        form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      });
      
      dropdown.appendChild(div);
    });
    
    dropdown.classList.add('active');
    searchRow.style.borderRadius = '24px 24px 0 0';
  };

  function closeDropdown() {
    dropdown.classList.remove('active');
    dropdown.innerHTML = '';
    searchRow.style.borderRadius = '999px';
  }

  // Close dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (!form.contains(e.target)) {
      closeDropdown();
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) {
      input.focus();
      return;
    }

    closeDropdown();
    
    // Clear search field after click/submit per requirements
    input.value = '';
    
    // Completely standalone HTTPS routing
    const url = 'https://www.google.com/search?q=' + encodeURIComponent(query) + '&udm=14';
    window.location.assign(url);
  });

  // Ambient, cursor-reactive wave field
  (function () {
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');
    const bg = '#FBFBF8';
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let mouse = { x: 0, y: 0, targetX: 0, targetY: 0, active: false, weight: 0 };
    let time = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function setPointer(x, y) {
      mouse.targetX = x;
      mouse.targetY = y;
      mouse.active = true;
    }
    window.addEventListener('mousemove', (e) => setPointer(e.clientX, e.clientY));
    window.addEventListener('mouseleave', () => { mouse.active = false; });
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length) setPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length) setPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => { mouse.active = false; });

    const layers = [
      { fraction: 0.52, amp: 70,  speed: 1.00, primary: '31,122,100',  secondary: '191,227,216', alphaA: 0.16, alphaB: 0.09 },
      { fraction: 0.68, amp: 95,  speed: 0.75, primary: '95,175,151',  secondary: '31,122,100',   alphaA: 0.16, alphaB: 0.10 },
      { fraction: 0.85, amp: 115, speed: 0.55, primary: '23,95,78',    secondary: '95,175,151',   alphaA: 0.20, alphaB: 0.11 }
    ];

    function draw() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      mouse.x += (mouse.targetX - mouse.x) * 0.06;
      mouse.y += (mouse.targetY - mouse.y) * 0.06;
      mouse.weight += ((mouse.active ? 1 : 0) - mouse.weight) * 0.04;

      time += 0.0035;
      ctx.globalCompositeOperation = 'multiply';

      layers.forEach((layer, i) => {
        const baseline = canvas.height * layer.fraction;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);

        for (let x = 0; x <= canvas.width; x += 12) {
          const n1 = Math.sin(x * 0.0022 + time * layer.speed + i * 2);
          const n2 = Math.sin(x * 0.0045 - time * layer.speed * 0.7 + i);
          let y = baseline + (n1 * 0.6 + n2 * 0.4) * layer.amp;

          const dist = Math.abs(x - mouse.x);
          if (dist < 380) {
            const pull = Math.pow(1 - dist / 380, 2);
            y += (mouse.y - baseline) * 0.05 * pull * mouse.weight;
          }
          ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();

        const gradient = ctx.createLinearGradient(0, canvas.height * 0.25, 0, canvas.height);
        gradient.addColorStop(0, `rgba(${layer.primary},0)`);
        gradient.addColorStop(0.4, `rgba(${layer.primary},${layer.alphaA})`);
        gradient.addColorStop(0.75, `rgba(${layer.secondary},${layer.alphaB})`);
        gradient.addColorStop(1, `rgba(${layer.primary},0)`);
        ctx.fillStyle = gradient;
        ctx.fill();
      });

      ctx.globalCompositeOperation = 'source-over';
    }

    if (reduceMotion) {
      draw();
    } else {
      (function loop() {
        draw();
        requestAnimationFrame(loop);
      })();
    }
  })();
</script>
</body>
</html>
